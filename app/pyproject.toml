[project]
name = "costcontrol"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
    "ruff>=0.8",
]

[project.scripts]
costcontrol = "costcontrol.app:main"

[tool.setuptools.packages.find]
include = ["costcontrol*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
